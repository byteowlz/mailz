[workspace]
resolver = "2"
members = [
    "crates/mailz-core",
    "crates/mailz-cli",
    "crates/mailz-tui",
    "crates/mailz-mcp",
    "crates/mailz-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/byteowlz/mailz"

[workspace.dependencies]
# Shared across workspace
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
config = { version = "0.15", features = ["toml"] }
dirs = "5.0"
shellexpand = "3.1"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# API/HTTP
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
utoipa = { version = "5.2", features = ["chrono"] }

# MCP
rmcp = { version = "0.12", features = ["server", "transport-io"] }

# Database
rusqlite = { version = "0.33", features = ["bundled"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# Internal crates
mailz-core = { path = "crates/mailz-core" }
